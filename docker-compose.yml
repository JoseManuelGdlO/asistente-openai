# Compose para EasyPanel (o Docker local).
# Configura las variables de entorno en EasyPanel → Environment
# (no hardcodees secretos aquí).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      UPLOADS_DIR: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ULTRAMSG_TOKEN: ${ULTRAMSG_TOKEN}
      ULTRAMSG_INSTANCE_ID: ${ULTRAMSG_INSTANCE_ID}
      ULTRAMSG_WEBHOOK_TOKEN: ${ULTRAMSG_WEBHOOK_TOKEN}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      OWN_API_BASE_URL: ${OWN_API_BASE_URL:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_EMBEDDED_SIGNUP_CONFIG_ID: ${META_EMBEDDED_SIGNUP_CONFIG_ID:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v22.0}
      META_BUSINESS_ID: ${META_BUSINESS_ID:-}
      META_SYSTEM_USER_ID: ${META_SYSTEM_USER_ID:-}
      META_SYSTEM_USER_TOKEN: ${META_SYSTEM_USER_TOKEN:-}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
